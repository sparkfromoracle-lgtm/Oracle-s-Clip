services:
  api:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - PORT=8000
      - API_HOST=0.0.0.0
      - API_KEYS=dev_key_local:tenant_dev
      - SERVICE_API_KEY=dev_key_local
      - DEFAULT_TENANT_ID=tenant_dev
      - WEBHOOK_SECRET=local_dev_webhook_secret_1234567890
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_BASE_DIR=/app/storage
      - ASR_PROVIDER=mock
      - CLIP_PROVIDER=mock
      - CORS_ALLOWED_ORIGINS=*
    volumes:
      - .:/app
      - api_venv:/opt/venv
    command: >
      bash -lc "apt-get update && apt-get install -y --no-install-recommends ffmpeg curl >/dev/null &&
      pip install -r requirements.txt &&
      python -m uvicorn media_service.api.app:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Dev-only tenant credentials matching the api service's API_KEYS above.
      - VITE_API_KEY=dev_key_local
      - VITE_TENANT_ID=tenant_dev
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command: bash -lc "npm install && npm run dev"

volumes:
  api_venv:
  web_node_modules:
